<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06060B">
<title>Nemesis Zentrale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2306060B'/%3E%3Cpath d='M32 10 L54 32 L32 54 L10 32 Z' fill='none' stroke='%23FF2D78' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06060B;--bg2:#0B0B14;--karte:#10101C;--karte2:#151526;--linie:#23233A;--linie2:#2E2E4A;
  --text:#EDEDF5;--text2:#A3A3BE;--text3:#6E6E8C;
  --pink:#FF2D78;--cyan:#22E0FF;--gelb:#FFD23F;--gruen:#3DDC97;--rot:#FF5C5C;--lila:#A78BFA;
  --r:12px;--schatten:0 10px 30px rgba(0,0,0,.45);
  --mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Space Grotesk',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
nav.seite{background:linear-gradient(180deg,#0A0A13,#07070D);border-right:1px solid var(--linie);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.marke{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:700;letter-spacing:.5px}
.marke svg{flex:none}.marke small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--text3);letter-spacing:2px;font-weight:400}
nav.seite button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--text2);font-weight:500}
nav.seite button:hover{background:var(--karte);color:var(--text)}
nav.seite button.an{background:linear-gradient(90deg,rgba(255,45,120,.16),rgba(255,45,120,.02));color:var(--text);box-shadow:inset 2px 0 0 var(--pink)}
nav.seite .ic{width:20px;text-align:center;opacity:.9}
nav.seite .zahl{margin-left:auto;background:var(--pink);color:#08080F;border-radius:20px;font-size:11px;font-weight:700;padding:1px 7px}
nav.seite .fuss{margin-top:auto;padding:12px;font-size:12px;color:var(--text3);border-top:1px solid var(--linie)}
main{padding:28px clamp(16px,3vw,40px) 120px;max-width:1280px;width:100%}
.kopf{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.kopf h1{font-size:26px;margin:0;letter-spacing:-.3px}
.kopf p{margin:4px 0 0;color:var(--text2)}
.kopf .rechts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mandantwahl{background:var(--karte);border:1px solid var(--linie);border-radius:9px;padding:8px 10px;min-width:200px}
.raster{display:grid;gap:14px}
.r4{grid-template-columns:repeat(4,1fr)}.r3{grid-template-columns:repeat(3,1fr)}.r2{grid-template-columns:repeat(2,1fr)}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:var(--r);padding:18px}
.karte h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.karte h3 .klein{margin-left:auto}
.kpi .wert{font-size:30px;font-weight:700;letter-spacing:-.5px}
.kpi .lbl{font-family:var(--mono);font-size:11px;letter-spacing:1.6px;color:var(--text3);text-transform:uppercase}
.kpi .unter{color:var(--text2);font-size:13px}
.knopf{cursor:pointer;border:1px solid var(--linie2);background:var(--karte2);border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.knopf:hover{border-color:var(--text3)}
.knopf.pri{background:var(--pink);border-color:var(--pink);color:#08080F}
.knopf.pri:hover{filter:brightness(1.08)}
.knopf.cy{background:var(--cyan);border-color:var(--cyan);color:#08080F}
.knopf.gefahr{border-color:rgba(255,92,92,.5);color:var(--rot)}
.knopf.gefahr.voll{background:var(--rot);color:#fff;border-color:var(--rot)}
.knopf.klein{padding:5px 10px;font-size:12.5px;border-radius:7px}
.knopf:disabled{opacity:.45;cursor:not-allowed}
label.f{display:block;font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin:14px 0 6px}
input.e,select.e,textarea.e{width:100%;background:var(--bg2);border:1px solid var(--linie);border-radius:9px;padding:11px 12px;outline:none}
input.e:focus,select.e:focus,textarea.e:focus{border-color:var(--cyan)}
textarea.e{min-height:90px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:var(--mono);padding:2px 9px;border-radius:20px;border:1px solid var(--linie2);color:var(--text2);white-space:nowrap}
.chip.ok{color:var(--gruen);border-color:rgba(61,220,151,.4)}.chip.lauf{color:var(--cyan);border-color:rgba(34,224,255,.4)}
.chip.warn{color:var(--gelb);border-color:rgba(255,210,63,.45)}.chip.err{color:var(--rot);border-color:rgba(255,92,92,.45)}.chip.pink{color:var(--pink);border-color:rgba(255,45,120,.45)}
.punkt{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.puls{animation:puls 1.4s infinite}@keyframes puls{50%{opacity:.35}}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;color:var(--text3);text-transform:uppercase;font-weight:400;padding:8px;border-bottom:1px solid var(--linie)}
table.t td{padding:10px 8px;border-bottom:1px solid var(--linie);vertical-align:top}
table.t tr.klick{cursor:pointer}table.t tr.klick:hover td{background:var(--karte2)}
.leer{padding:34px;text-align:center;color:var(--text3)}
.agenten{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.agent{background:radial-gradient(120% 80% at 50% 0%,var(--glow,rgba(34,224,255,.10)),transparent 60%),var(--karte);border:1px solid var(--linie);border-radius:16px;padding:18px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s;position:relative}
.agent:hover{transform:translateY(-2px);border-color:var(--linie2)}
.agent .name{font-weight:700;font-size:17px;margin-top:8px}.agent .rolle{color:var(--text2);font-size:13px}
.agent .stat{display:flex;justify-content:center;gap:12px;margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--text3)}
.agent .aktivpunkt{position:absolute;top:14px;right:14px}
.studio{display:grid;grid-template-columns:320px 1fr;gap:18px}
.buehne{background:radial-gradient(90% 70% at 50% 30%,rgba(255,45,120,.14),transparent 70%),linear-gradient(180deg,#0E0E1A,#08080F);border:1px solid var(--linie);border-radius:18px;padding:22px;text-align:center;position:sticky;top:20px}
.buehne .nm{font-size:22px;font-weight:700;margin-top:6px}.buehne .rl{color:var(--text2)}
.wahl{display:flex;gap:6px;flex-wrap:wrap}
.wahl button{cursor:pointer;border:1px solid var(--linie);background:var(--bg2);border-radius:8px;padding:6px 10px;font-size:13px}
.wahl button.an{border-color:var(--cyan);color:var(--cyan)}
.farbe{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.farbe.an{border-color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--linie);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;color:var(--text2);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.an{color:var(--text);border-color:var(--pink)}
.zeitleiste{position:relative;padding-left:22px}
.zeitleiste:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--linie)}
.ereignis{position:relative;margin-bottom:12px}
.ereignis:before{content:"";position:absolute;left:-19px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--farbe,var(--text3));box-shadow:0 0 0 3px var(--bg)}
.ereignis .zt{font-family:var(--mono);font-size:11px;color:var(--text3)}
.ereignis .tx{white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.ereignis pre,.code{background:#07070C;border:1px solid var(--linie);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;overflow:auto;max-height:260px;white-space:pre-wrap;word-break:break-word;margin:6px 0 0}
.planliste{margin:0;padding-left:20px;color:var(--text2)}
.zeile{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.zeile.zw{justify-content:space-between}
.mut{color:var(--text2)}.klein{font-size:12.5px}.mono{font-family:var(--mono)}
.rechte td select{min-width:190px}
.art{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--karte2);color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.art.extern{color:var(--pink)}.art.destruktiv{color:var(--rot)}.art.ausfuehren{color:var(--gelb)}.art.schreiben{color:var(--cyan)}.art.lesen{color:var(--gruen)}
.regler{width:100%;accent-color:var(--pink)}
.hinweis{border-left:3px solid var(--gelb);padding:8px 12px;background:rgba(255,210,63,.06);color:var(--text2);font-size:13.5px;border-radius:0 8px 8px 0}
.hinweis.rot{border-color:var(--rot);background:rgba(255,92,92,.07)}
.hinweis.cy{border-color:var(--cyan);background:rgba(34,224,255,.06)}
.notaus{background:linear-gradient(90deg,#3a0711,#1a0408);border:1px solid var(--rot);border-radius:12px;padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
iframe.vorschau{width:100%;height:520px;border:1px solid var(--linie);border-radius:10px;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--karte2);border:1px solid var(--linie2);padding:12px 18px;border-radius:10px;box-shadow:var(--schatten);z-index:99;max-width:90vw}
.toast.err{border-color:var(--rot)}
.modal{position:fixed;inset:0;background:rgba(3,3,8,.78);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal .in{background:var(--karte);border:1px solid var(--linie2);border-radius:16px;padding:22px;max-width:720px;width:100%;box-shadow:var(--schatten)}
.login{max-width:420px;margin:12vh auto;padding:0 16px}
.mailtext{white-space:pre-wrap;background:var(--bg2);border:1px solid var(--linie);border-radius:8px;padding:12px;font-size:14px}
.unten{display:none}
@media (max-width:980px){.r4{grid-template-columns:repeat(2,1fr)}.r3,.r2{grid-template-columns:1fr}.studio{grid-template-columns:1fr}.buehne{position:static}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}nav.seite{display:none}
  main{padding:18px 16px 110px}
  .unten{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,14,.96);backdrop-filter:blur(8px);border-top:1px solid var(--linie);z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto}
  .unten button{all:unset;flex:1 0 64px;text-align:center;font-size:10.5px;color:var(--text2);padding:4px 2px;position:relative}
  .unten button .ic{display:block;font-size:18px}
  .unten button.an{color:var(--pink)}
  .unten .zahl{position:absolute;top:0;right:14px;background:var(--pink);color:#08080F;border-radius:10px;font-size:9px;padding:0 5px;font-weight:700}
  .kopf h1{font-size:22px}.kpi .wert{font-size:24px}
  table.t.mobil thead{display:none}table.t.mobil tr{display:block;border-bottom:1px solid var(--linie);padding:8px 0}table.t.mobil td{display:block;border:0;padding:3px 4px}
}
</style>
</head>
<body>
<div id="root"><div class="leer">Zentrale startet…</div></div>
<script>
"use strict";
/* ================= Grundlagen ================= */
const $ = (s, e) => (e || document).querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const BASIS = location.pathname.replace(/\/zentrale\/?$/, "");
const API = BASIS + "/zentrale/api";
let TOKEN = ""; try { TOKEN = localStorage.getItem("nx:zentrale:token") || ""; } catch (e) {}
const S = { ich: null, katalog: null, mandanten: [], tid: "", seite: "uebersicht", daten: {}, laufId: "", agentId: "", timer: null, tab: "" };
try { const m = JSON.parse(localStorage.getItem("nx:zentrale:ui") || "{}"); if (m.tid) S.tid = m.tid; if (m.seite) S.seite = m.seite; } catch (e) {}
const merkeUi = () => { try { localStorage.setItem("nx:zentrale:ui", JSON.stringify({ tid: S.tid, seite: S.seite })); } catch (e) {} };

async function api(pfad, body, methode) {
  const h = { "Content-Type": "application/json" };
  if (TOKEN) h.Authorization = "Bearer " + TOKEN;
  const r = await fetch(API + pfad, { method: methode || (body !== undefined ? "POST" : "GET"), headers: h, body: body !== undefined ? JSON.stringify(body) : undefined, credentials: "same-origin" });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error((j && j.error) || ("Fehler " + r.status)); e.status = r.status; throw e; }
  return j;
}
const mApi = (p, b) => api("/m/" + S.tid + p, b);
function toast(t, err) { const d = document.createElement("div"); d.className = "toast" + (err ? " err" : ""); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), err ? 6000 : 3000); }
const zeit = (t) => { if (!t) return "–"; const d = new Date(t); return d.toLocaleDateString("de-CH", { day: "2-digit", month: "2-digit" }) + " " + d.toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" }); };
const seit = (t) => { const s = Math.round((Date.now() - Date.parse(t)) / 1000); return s < 60 ? s + " s" : s < 3600 ? Math.round(s / 60) + " min" : s < 86400 ? Math.round(s / 3600) + " h" : Math.round(s / 86400) + " T"; };
const STATUS = { laeuft: ["lauf", "Läuft"], wartet: ["lauf", "In Warteschlange"], wartet_freigabe: ["warn", "Wartet auf dich"], wartet_kontingent: ["warn", "Pausiert: Gratis-Kontingent"], fertig: ["ok", "Fertig"], fehler: ["err", "Fehler"], gestoppt: ["", "Gestoppt"] };
const statusChip = (s) => { const [k, t] = STATUS[s] || ["", s]; return `<span class="chip ${k}"><span class="punkt ${s === "laeuft" ? "puls" : ""}"></span>${esc(t)}</span>`; };

/* ================= Avatar-Generator (SVG, deterministisch) ================= */
const HAUT = ["#F2D1B5", "#E0B08A", "#C28860", "#8D5A3B", "#5C3A26"];
function avatarSvg(av, name, groesse) {
  av = av || {}; const g = groesse || 120, c = av.farbe || "#22E0FF", a = av.akzent || "#FF2D78", haut = HAUT[av.haut || 0] || HAUT[0];
  const id = "a" + Math.random().toString(36).slice(2, 8);
  const ini = String(name || "?").split(/\s+/).map((x) => x[0]).join("").slice(0, 2).toUpperCase();
  const rahmen = { rund: `<circle cx="60" cy="60" r="56"/>`, eckig: `<rect x="6" y="6" width="108" height="108" rx="26"/>`, schild: `<path d="M60 4 L112 22 V62 C112 92 88 110 60 116 C32 110 8 92 8 62 V22 Z"/>`, hex: `<path d="M60 4 L110 32 V88 L60 116 L10 88 V32 Z"/>` }[av.form || "rund"] || `<circle cx="60" cy="60" r="56"/>`;
  const haare = [
    `<path d="M36 50 C36 30 50 24 60 24 C72 24 85 30 84 50 C80 40 70 36 60 36 C50 36 40 40 36 50Z" fill="#1d1d2b"/>`,
    `<path d="M34 54 C32 28 50 20 62 21 C80 22 88 34 86 54 L82 44 C74 34 50 32 38 44Z" fill="#2a1d14"/>`,
    `<path d="M33 60 C30 30 48 20 61 20 C78 20 90 32 87 60 C88 76 84 84 82 86 L82 52 C76 38 46 36 38 52 L38 86 C34 82 32 74 33 60Z" fill="#3b2416"/>`,
    `<path d="M36 50 C34 30 48 22 60 22 C74 22 88 30 84 50 C76 34 64 46 52 36 C46 42 40 44 36 50Z" fill="#c8a165"/>`,
    `<path d="M38 44 C42 26 78 26 82 44 C70 36 50 36 38 44Z" fill="#0f0f17"/><circle cx="60" cy="22" r="9" fill="#0f0f17"/>`,
  ][av.frisur || 0];
  const acc = {
    headset: `<path d="M38 56 C38 34 82 34 82 56" fill="none" stroke="${a}" stroke-width="4"/><rect x="33" y="52" width="9" height="15" rx="4" fill="${a}"/><rect x="78" y="52" width="9" height="15" rx="4" fill="${a}"/><path d="M38 66 C40 76 50 78 56 77" fill="none" stroke="${a}" stroke-width="2.5"/><circle cx="57" cy="77" r="3" fill="${a}"/>`,
    brille: `<g fill="none" stroke="${a}" stroke-width="2.6"><rect x="43" y="51" width="14" height="10" rx="4"/><rect x="63" y="51" width="14" height="10" rx="4"/><path d="M57 55 H63"/></g>`,
    lupe: `<circle cx="88" cy="84" r="9" fill="rgba(255,255,255,.08)" stroke="${a}" stroke-width="3"/><path d="M95 91 L103 99" stroke="${a}" stroke-width="4" stroke-linecap="round"/>`,
    krone: `<path d="M44 30 L50 18 L56 28 L60 14 L64 28 L70 18 L76 30 Z" fill="${a}"/>`,
    kopfhoerer: `<path d="M36 58 C36 30 84 30 84 58" fill="none" stroke="${a}" stroke-width="5"/><rect x="30" y="52" width="11" height="18" rx="5" fill="${a}"/><rect x="79" y="52" width="11" height="18" rx="5" fill="${a}"/>`,
    helm: `<path d="M34 52 C34 26 86 26 86 52 Z" fill="${a}" opacity=".9"/><rect x="32" y="48" width="56" height="6" rx="3" fill="${a}"/>`,
  }[av.accessoire || ""] || "";
  return `<svg width="${g}" height="${g}" viewBox="0 0 120 120" role="img" aria-label="Avatar ${esc(name)}">
  <defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".9"/><stop offset="1" stop-color="${a}" stop-opacity=".75"/></linearGradient>
  <radialGradient id="${id}h" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#1b1b2e"/><stop offset="1" stop-color="#0a0a12"/></radialGradient>
  <clipPath id="${id}c">${rahmen}</clipPath><filter id="${id}f"><feGaussianBlur stdDeviation="3"/></filter></defs>
  <g fill="url(#${id}g)" filter="url(#${id}f)" opacity=".55">${rahmen}</g>
  <g fill="url(#${id}h)" stroke="url(#${id}g)" stroke-width="3">${rahmen}</g>
  <g clip-path="url(#${id}c)">
    <path d="M22 120 C24 94 42 86 60 86 C78 86 96 94 98 120Z" fill="${c}" opacity=".95"/>
    <path d="M50 86 L60 98 L70 86" fill="none" stroke="${a}" stroke-width="3"/>
    <rect x="53" y="74" width="14" height="14" rx="5" fill="${haut}"/>
    <ellipse cx="60" cy="56" rx="22" ry="25" fill="${haut}"/>
    ${haare}
    <ellipse cx="51" cy="56" rx="2.6" ry="3.2" fill="#14141f"/><ellipse cx="69" cy="56" rx="2.6" ry="3.2" fill="#14141f"/>
    <circle cx="52" cy="55" r=".9" fill="#fff"/><circle cx="70" cy="55" r=".9" fill="#fff"/>
    <path d="M53 68 Q60 73 67 68" fill="none" stroke="#7a3b3b" stroke-width="2" stroke-linecap="round"/>
    ${acc}
  </g>
  <g><rect x="80" y="96" width="30" height="18" rx="9" fill="#06060B" stroke="${a}" stroke-width="1.5"/><text x="95" y="109" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" font-weight="700" fill="${a}">${esc(ini)}</text></g>
</svg>`;
}

/* ================= Navigation ================= */
const SEITEN = [
  ["uebersicht", "◈", "Übersicht"], ["agenten", "◉", "Agenten"], ["auftraege", "▶", "Aufträge"], ["freigaben", "✓", "Freigaben"],
  ["office", "✉", "Office"], ["dateien", "▤", "Dateien"], ["kosten", "₣", "Kosten"], ["audit", "⛨", "Audit-Log"], ["einstellungen", "⚙", "Einstellungen"],
];
function nav() {
  const fr = (S.daten.uebersicht && S.daten.uebersicht.freigaben) || 0;
  const liste = SEITEN.concat(S.ich && S.ich.rolle === "admin" ? [["mandanten", "⌂", "Kunden"], ["modelle", "⚡", "Modelle & Kosten"]] : []);
  const knopf = (s, kl) => `<button class="${S.seite === s[0] ? "an" : ""}" data-seite="${s[0]}"><span class="ic">${s[1]}</span>${kl ? "" : ""}${esc(s[2])}${s[0] === "freigaben" && fr ? `<span class="zahl">${fr}</span>` : ""}</button>`;

function mandantWahl() {

async function zeichne() {
  clearTimeout(S.timer);
  const root = $("#root");
  if (!S.ich) return;
  let inhalt = "";
  try {
    if (!["mandanten", "modelle"].includes(S.seite) && !S.tid) inhalt = kopf("Willkommen") + `<div class="karte leer">Noch kein Kunde angelegt. ${S.ich.rolle === "admin" ? '<br><br><button class="knopf pri" data-seite="mandanten">Ersten Pilotkunden anlegen</button>' : ""}</div>`;
    else inhalt = await (SEITE[S.seite] || SEITE.uebersicht)();
  } catch (e) { inhalt = kopf("Fehler") + `<div class="hinweis rot">${esc(e.message)}</div>`; }
  const notaus = S.ich.notaus ? `<div class="notaus"><b>⛔ NOTAUS AKTIV</b><span class="mut">Alle Agenten sind gestoppt, neue Aufträge gesperrt.</span>${S.ich.rolle === "admin" ? '<button class="knopf klein" id="notausAus" style="margin-left:auto">Notaus aufheben</button>' : ""}</div>` : "";
  root.innerHTML = `<div class="app">${nav()}<main>${notaus}${inhalt}</main></div>`;
  binde();
  if (S.auto) S.timer = setTimeout(async () => { if (document.hidden) return zeichne(); try { await laden(); } catch (e) {} zeichne(); }, S.auto);
}
async function laden() {
  if (S.ich.rolle === "admin") S.mandanten = (await api("/mandanten")).mandanten;
  if (S.ich.rolle === "mandant") S.tid = S.ich.mandant;
  if (S.ich.rolle === "admin" && S.mandanten.length && !S.mandanten.some((m) => m.id === S.tid)) S.tid = S.mandanten[0].id;
  if (S.tid) S.daten.uebersicht = await mApi("/uebersicht");
  S.ich = await api("/ich");
}
function geh(seite, extra) { S.seite = seite; Object.assign(S, extra || {}); merkeUi(); window.scrollTo(0, 0); zeichne(); }

  const titel = { start: "Start", plan: "Analyse & Plan", gedanke: "Gedanke", werkzeug: "Aktion", ergebnis: "Ergebnis", werkzeugfehler: "Fehler (wird korrigiert)", gesperrt: "Gesperrt durch Rechte", freigabe: "Freigabe angefragt", entscheid: "Entscheid", frage: "Rückfrage", fertig: "Fertig", fehler: "Abbruch", stopp: "Gestoppt", pruefung: "Abschlussprüfung (Build/Tests)", delegation: "Delegiert", warnung: "Warnung" };
  const ev = l.log.slice().reverse().slice(0, 200).map((e) => `<div class="ereignis" style="--farbe:${farbe[e.typ] || "var(--text3)"}"><div class="zt">${zeit(e.t)} · ${esc(titel[e.typ] || e.typ)}${e.werkzeug ? " · <b>" + esc(e.werkzeug) + "</b>" : ""}${e.ms ? " · " + e.ms + " ms" : ""}${e.typ === "pruefung" ? (e.ok ? ' <span class="chip ok">bestanden</span>' : ' <span class="chip err">fehlgeschlagen</span>') : ""}</div>

    ${e.x ? (["ergebnis", "werkzeugfehler", "pruefung"].includes(e.typ) ? `<pre>${esc(e.x)}</pre>` : `<div class="tx">${esc(e.x)}</div>`) : ""}${e.args ? `<pre>${esc(e.args)}</pre>` : ""}</div>`).join("");
  const fr = l.freigabe && !l.freigabe.entscheid ? `<div class="karte" style="border-color:var(--gelb);margin-bottom:14px"><h3>⚠ ${l.freigabe.art === "frage" ? "Rückfrage des Agenten" : "Freigabe nötig: " + esc(l.freigabe.werkzeug)}</h3>

      if (d.officebericht) { const r = await mApi("/laeufe", { agentId: d.officebericht, ziel: "Erstelle einen Aktivitaetsbericht der letzten 7 Tage als Dokument (Ordner Berichte): Kennzahlen, wichtigste Anfragen, offene Aufgaben, Empfehlungen.", stunden: 0.25 }); return geh("auftraege", { laufId: r.lauf.id }); }

      if ("export" in d) { const r = await mApi("/export"); const b = new Blob([JSON.stringify(r, null, 1)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "nemesis-" + S.tid + "-" + new Date().toISOString().slice(0, 10) + ".json"; a.click(); return; }

      if ("smtp" in d) { await mApi("/smtp", { smtp: { host: $("#smHost").value, port: +$("#smPort").value, benutzer: $("#smUser").value, passwort: $("#smPw").value || undefined, von: $("#smVon").value, vonName: $("#smName").value } }); toast("SMTP gespeichert"); await laden(); return zeichne(); }

      if (d.mbzurueck) { await api("/modelle", { bestaetigen: { anbieter: d.mbzurueck, zuruecknehmen: true } }); return zeichne(); }
      if (d.mverif) { const r = await api("/modelle/verifizieren", { anbieter: d.mverif }); toast(r.ergebnis.gratis + " Gratis-Modelle, " + r.ergebnis.bezahlt + " kostenpflichtige erkannt"); return zeichne(); }

      if (d.mfweg) { await api("/modelle", { freigabe: { entfernen: d.mfweg } }); toast("Freigabe entzogen"); return zeichne(); }
      if ("mfneu" in d) { await api("/modelle", { freigabe: { anbieter: $("#mfA").value, muster: $("#mfM").value.trim(), budgetChfTag: +$("#mfB").value, chfPro1MTokens: +$("#mfP").value, bis: $("#mfBis").value ? new Date($("#mfBis").value + "T23:59:59").toISOString() : null, bestaetigung: $("#mfOk").value.trim() } }); toast("Freigabe gespeichert"); return zeichne(); }
      if ("ocspeichern" in d) { const r = await api("/openclaw", { url: $("#ocUrl").value.trim(), token: $("#ocTok").value || undefined, agentId: $("#ocAgent").value.trim(), aktiv: $("#ocAktiv").checked, profilJeMandant: $("#ocProfil").checked, mandanten: [...document.querySelectorAll("#ocMand .an")].map((b) => b.dataset.ocm) }); toast("OpenClaw gespeichert"); return zeichne(); }

    const t = ev.target, d = t.dataset;

    if (d.p) ENTWURF.persoenlichkeit[d.p] = d.p === "eigenschaften" ? t.value.split(",").map((x) => x.trim()).filter(Boolean) : t.value;
    if (d.wissen) ENTWURF.wissen[+d.wissen][d.wf] = t.value;
    if (d.limit) ENTWURF.limits[d.limit] = +t.value;
  };
  root.onchange = async (ev) => {
    const t = ev.target, d = t.dataset;
    if (t.id === "tidwahl") { S.tid = t.value; merkeUi(); await laden(); return zeichne(); }
    if (t.id === "projektwahl") { S.projekt = t.value; return zeichne(); }
    if (d.recht && ENTWURF) { ENTWURF.werkzeuge[d.recht] = t.value; }
    if (d.feld === "autonomie") zeichne();
  };
}

function loginSeite(fehler) {

  <div class="karte"><h3>Anmelden</h3><p class="mut klein">Gib dein Zugangs-Token ein. Du hast es von deinem Nemesis-Betreuer erhalten.</p>${fehler ? `<div class="hinweis rot">${esc(fehler)}</div>` : ""}
  <input class="e" id="tok" type="password" placeholder="nxm_…" autocomplete="current-password"><button class="knopf pri" style="width:100%;margin-top:12px" id="tokOk">Anmelden</button></div></div>`;
  const go = async () => { TOKEN = $("#tok").value.trim(); try { localStorage.setItem("nx:zentrale:token", TOKEN); } catch (e) {} try { await start(); } catch (e) { loginSeite(e.message); } };
