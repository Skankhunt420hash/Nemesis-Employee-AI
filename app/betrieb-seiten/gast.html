<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chat</title><meta name="theme-color" content="#1f2937">
<link rel="manifest" id="mf"><link rel="apple-touch-icon" id="ai"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--c:#1f2937;--t:#fff}*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f5f7;color:#111;padding-bottom:90px}
header{background:var(--c);color:var(--t);padding:26px 18px 22px}
header h1{margin:0;font-size:26px;line-height:1.2}header p{margin:6px 0 0;opacity:.85;font-size:15px}
.acts{display:flex;gap:10px;padding:14px 14px 4px;flex-wrap:wrap}
.acts a,.acts button{flex:1 1 30%;min-width:96px;text-align:center;text-decoration:none;background:#fff;color:#111;border:1px solid #e0e3e8;border-radius:12px;padding:12px 6px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.acts .main{background:var(--c);color:var(--t);border-color:var(--c);flex-basis:100%;font-size:16px;padding:14px}
.card{background:#fff;border:1px solid #e3e5ea;border-radius:12px;margin:12px 14px;padding:14px 16px}
.card h2{margin:0 0 8px;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:#6b7280}
.pre{white-space:pre-wrap}.it{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid #eef0f3}.it:first-of-type{border-top:0}
.it b{font-weight:600}.it small{display:block;color:#6b7280;font-size:13px;line-height:1.35}.pr{white-space:nowrap;font-weight:600}
.gk{font-weight:700;margin:12px 0 2px;color:var(--c)}
.fab{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--c);color:var(--t);border:0;border-radius:99px;padding:16px;font:inherit;font-size:17px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.3);cursor:pointer;z-index:5}
#chatp{position:fixed;inset:0;background:#f4f5f7;display:none;flex-direction:column;z-index:10}
#chatp.on{display:flex}
#ch{background:var(--c);color:var(--t);padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
#ch button{background:none;border:0;color:var(--t);font-size:24px;cursor:pointer}
#log{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:9px}
.m{max-width:86%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.b{background:#fff;border:1px solid #e3e5ea;align-self:flex-start;border-bottom-left-radius:4px}
.u{background:var(--c);color:var(--t);align-self:flex-end;border-bottom-right-radius:4px}.w{opacity:.6;font-style:italic}
#chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 8px}
#chips button{border:1px solid #cfd3da;background:#fff;border-radius:99px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e3e5ea}
input{flex:1;border:1px solid #cfd3da;border-radius:99px;padding:12px 15px;font:inherit;min-width:0}
button.s{border:0;background:var(--c);color:var(--t);border-radius:99px;padding:0 20px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}
.emb body{padding:0}.emb header,.emb .acts,.emb .card,.emb .fab,.emb #ch button{display:none}.emb #ch{padding:12px 16px}
</style></head><body>
<header><h1 id="n"></h1><p id="s"></p></header>
<div class="acts" id="ac"></div>
<div id="info"></div>
<div id="menu"></div>
<div class="card" id="inst" style="display:none"><h2>Als App speichern</h2><div id="it" class="pre"></div></div>
<button class="fab" id="fab"></button>
<div id="chatp"><div id="ch"><span id="cn"></span><button id="cx" aria-label="Schliessen">×</button></div>
<div id="log"></div><div id="chips"></div>
<form id="f"><input id="i" autocomplete="off" placeholder="Ihre Nachricht…" maxlength="800"><button class="s" id="b">Senden</button></form></div>
<script>
var B=/*BDATA*/null||{id:"x",name:"Chat",greeting:"Grüezi!",farbe:"#1f2937",vorschlaege:[],agent:"Assistent"};
var verlauf=[],log=document.getElementById("log"),inp=document.getElementById("i"),btn=document.getElementById("b"),panel=document.getElementById("chatp");
function hell(h){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return (r*299+g*587+b*114)/1000>150}
var R=document.documentElement;R.style.setProperty("--c",B.farbe);R.style.setProperty("--t",hell(B.farbe)?"#111":"#fff");
document.querySelector("meta[name=theme-color]").setAttribute("content",B.farbe);
document.getElementById("mf").href="/b/"+B.id+"/manifest.json";document.getElementById("ai").href="/b/"+B.id+"/icon-180.png";
if(B.eingebettet)R.className="emb";
document.title=B.name;document.getElementById("n").textContent=B.name;document.getElementById("s").textContent=B.agent+" · digitaler Assistent";document.getElementById("cn").textContent=B.name+" · "+B.agent;
function el(t,c,x){var d=document.createElement(t);if(c)d.className=c;if(x!=null)d.textContent=x;return d}
function add(t,k){var d=el("div","m "+k,t);log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
var ac=document.getElementById("ac"),fab=document.getElementById("fab");
var lbl=B.preset==="restaurant"?"💬 Tisch reservieren / Fragen":B.preset==="shop"?"💬 Fragen zu Produkten & Bestellung":"💬 Termin buchen / Fragen";
fab.textContent=lbl;fab.onclick=oeffnen;
var mainb=el("button","main",lbl);mainb.onclick=oeffnen;ac.appendChild(mainb);
if(B.telefon){var a=el("a","","📞 Anrufen");a.href="tel:"+B.telefon.replace(/[^\d+]/g,"");ac.appendChild(a)}
if(B.adresse){var a2=el("a","","📍 Route");a2.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(B.name+" "+B.adresse);a2.target="_blank";a2.rel="noopener";ac.appendChild(a2)}
var info=document.getElementById("info");
function karte(t,x){var c=el("div","card");c.appendChild(el("h2","",t));c.appendChild(el("div","pre",x));info.appendChild(c)}
if(B.zeiten)karte("Öffnungszeiten",B.zeiten);if(B.adresse)karte("Adresse",B.adresse);if(B.hinweise)karte("Gut zu wissen",B.hinweise);
var mn=document.getElementById("menu");
if(B.menue&&B.menue.gruppen.length){var c=el("div","card");c.appendChild(el("h2","",B.menue.titel));
  B.menue.gruppen.forEach(function(g){if(g.k)c.appendChild(el("div","gk",g.k));g.items.forEach(function(i){var r=el("div","it"),l=el("div");l.appendChild(el("b","",i.n));if(i.b)l.appendChild(el("small","",i.b));if(i.a)l.appendChild(el("small","","Allergene: "+i.a));r.appendChild(l);r.appendChild(el("span","pr",i.p!==""?(typeof i.p==="number"?i.p.toFixed(2).replace(/\.00$/,".–"):i.p):""));c.appendChild(r)})});
  if(B.preset==="restaurant")c.appendChild(el("small","","Angaben ohne Gewähr. Bei Allergien bitte unbedingt das Personal fragen."));mn.appendChild(c)}
// App-Hinweis
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent),stand=window.matchMedia&&matchMedia("(display-mode: standalone)").matches||navigator.standalone;
if(!stand&&!B.eingebettet){var ic=document.getElementById("inst");ic.style.display="block";
  document.getElementById("it").textContent=ios?"iPhone: unten auf «Teilen» tippen, dann «Zum Home-Bildschirm».":"Android: Browser-Menü (⋮) → «App installieren» oder «Zum Startbildschirm».";
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();var b=el("button","s","Jetzt installieren");b.style.cssText="margin-top:10px;padding:11px 18px";b.onclick=function(){e.prompt()};ic.appendChild(b)})}
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("/b/"+B.id+"/sw.js")}catch(e){}
var gestartet=false;
function oeffnen(){panel.className="on";if(!gestartet){gestartet=true;add(B.greeting,"b");(B.vorschlaege||[]).forEach(function(t){var x=el("button","",t);x.type="button";x.onclick=function(){senden(t)};document.getElementById("chips").appendChild(x)})}setTimeout(function(){inp.focus()},50)}
document.getElementById("cx").onclick=function(){panel.className=""};
function senden(t){
  t=(t||"").trim();if(!t||btn.disabled)return;document.getElementById("chips").style.display="none";
  add(t,"u");verlauf.push({role:"user",content:t});inp.value="";btn.disabled=true;
  var w=add("…","b w");
  fetch("/b/"+B.id+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:verlauf.slice(-12)})})
   .then(function(r){return r.json().catch(function(){return {}})})
   .then(function(d){w.remove();var a=d&&d.text?d.text:(d&&d.error)||"Da ist etwas schiefgelaufen. Bitte versuchen Sie es gleich nochmal.";add(a,"b");verlauf.push({role:"assistant",content:a})})
   .catch(function(){w.remove();add("Keine Verbindung. Bitte versuchen Sie es nochmal.","b")})
   .then(function(){btn.disabled=false;inp.focus()});
}
document.getElementById("f").onsubmit=function(e){e.preventDefault();senden(inp.value)};
if(B.eingebettet)oeffnen();
</script></body></html>
