<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chat</title>
<style>
:root{--c:#1f2937;--t:#fff}*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f5f7;color:#111;display:flex;flex-direction:column}
header{background:var(--c);color:var(--t);padding:14px 16px;font-weight:700;font-size:17px}
header small{display:block;font-weight:400;opacity:.8;font-size:12.5px;margin-top:2px}
#log{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:9px}
.m{max-width:86%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.b{background:#fff;border:1px solid #e3e5ea;align-self:flex-start;border-bottom-left-radius:4px}
.u{background:var(--c);color:var(--t);align-self:flex-end;border-bottom-right-radius:4px}
.w{opacity:.6;font-style:italic}
#chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 8px}
#chips button{border:1px solid #cfd3da;background:#fff;border-radius:99px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e3e5ea}
input{flex:1;border:1px solid #cfd3da;border-radius:99px;padding:12px 15px;font:inherit;min-width:0}
button.s{border:0;background:var(--c);color:var(--t);border-radius:99px;padding:0 20px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
</style></head><body>
<header><span id="n"></span><small id="s"></small></header>
<div id="log"></div><div id="chips"></div>
<form id="f"><input id="i" autocomplete="off" placeholder="Ihre Nachricht…" maxlength="800"><button class="s" id="b">Senden</button></form>
<script>
var B=/*BDATA*/null||{name:"Chat",greeting:"Grüezi!",farbe:"#1f2937",vorschlaege:[]};
var verlauf=[],log=document.getElementById("log"),inp=document.getElementById("i"),btn=document.getElementById("b");
function hell(h){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return (r*299+g*587+b*114)/1000>150}
document.documentElement.style.setProperty("--c",B.farbe);document.documentElement.style.setProperty("--t",hell(B.farbe)?"#111":"#fff");
document.title=B.name;document.getElementById("n").textContent=B.name;document.getElementById("s").textContent=B.agent+" · digitaler Assistent";
function add(t,k){var d=document.createElement("div");d.className="m "+k;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
add(B.greeting,"b");
var chips=document.getElementById("chips");
(B.vorschlaege||[]).forEach(function(t){var x=document.createElement("button");x.type="button";x.textContent=t;x.onclick=function(){senden(t)};chips.appendChild(x)});
function senden(t){
  t=(t||"").trim();if(!t||btn.disabled)return;chips.style.display="none";
  add(t,"u");verlauf.push({role:"user",content:t});inp.value="";btn.disabled=true;
  var w=add("…","b w");
  fetch(location.pathname.replace(/\/?$/,""),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:verlauf.slice(-12)})})
   .then(function(r){return r.json().catch(function(){return {}})})
   .then(function(d){w.remove();var a=d&&d.text?d.text:(d&&d.error)||"Da ist etwas schiefgelaufen. Bitte versuchen Sie es gleich nochmal.";add(a,"b");verlauf.push({role:"assistant",content:a})})
   .catch(function(){w.remove();add("Keine Verbindung. Bitte versuchen Sie es nochmal.","b")})
   .then(function(){btn.disabled=false;inp.focus()});
}
document.getElementById("f").onsubmit=function(e){e.preventDefault();senden(inp.value)};
</script></body></html>
